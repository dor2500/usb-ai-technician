    <text x="22" y="152" xml:space="preserve"><tspan fill="#d4d4d4">  PC     OFFICE-PC-07 - Microsoft Windows 11 Pro (build 26100)</tspan></text>
    <text x="22" y="172" xml:space="preserve"><tspan fill="#d4d4d4">  RAM    16.0 GB    Free on C: 41.7 GB</tspan></text>
