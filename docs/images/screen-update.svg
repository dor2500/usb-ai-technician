<svg xmlns="http://www.w3.org/2000/svg" width="906" height="750" viewBox="0 0 906 750">
  <rect width="100%" height="100%" rx="10" fill="#0c0c0c"/>
  <rect width="906" height="34" rx="10" fill="#1f1f1f"/><rect y="24" width="906" height="10" fill="#1f1f1f"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="453" y="22" fill="#9da5b4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Administrator: USB AI Technician</text>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14">
    <text x="22" y="52" xml:space="preserve"><tspan fill="#4fc1ff">=== 2. Install programs from the USB ===</tspan></text>
    <text x="22" y="72" xml:space="preserve"></text>
    <text x="22" y="92" xml:space="preserve"><tspan fill="#7a828e">  No.  File                                         Size       Mode</tspan></text>
    <text x="22" y="112" xml:space="preserve"><tspan fill="#d4d4d4">  1    ChromeSetup.exe                              10.6 MB    silent (custom switches)</tspan></text>
    <text x="22" y="132" xml:space="preserve"><tspan fill="#d4d4d4">  2    7z2408-x64.exe                               1.6 MB     silent (nsis)</tspan></text>
    <text x="22" y="152" xml:space="preserve"><tspan fill="#d4d4d4">  3    VSCodeUserSetup-x64-1.105.0.exe              98.3 MB    silent (inno)</tspan></text>
    <text x="22" y="172" xml:space="preserve"><tspan fill="#d4d4d4">  4    ZoomInstallerFull.msi                        87.2 MB    silent (msi)</tspan></text>
    <text x="22" y="192" xml:space="preserve"></text>
    <text x="22" y="212" xml:space="preserve"><tspan fill="#d4d4d4">  Which to install? (e.g. 1,3-4 / all / empty = none): </tspan><tspan fill="#ffd866">all</tspan></text>
    <text x="22" y="232" xml:space="preserve"><tspan fill="#d4d4d4">Installing ChromeSetup.exe...</tspan></text>
    <text x="22" y="252" xml:space="preserve"><tspan fill="#4ec96b">  installed</tspan></text>
    <text x="22" y="272" xml:space="preserve"><tspan fill="#7a828e">  ...</tspan></text>
    <text x="22" y="292" xml:space="preserve"><tspan fill="#4ec96b">Installed 4 of 4.</tspan></text>
    <text x="22" y="312" xml:space="preserve"></text>
    <text x="22" y="332" xml:space="preserve"><tspan fill="#4fc1ff">=== 3. Update Windows, then switch to security-only updates ===</tspan></text>
    <text x="22" y="352" xml:space="preserve"><tspan fill="#d4d4d4">This PC: Windows 11 24H2 (build 26100)</tspan></text>
    <text x="22" y="372" xml:space="preserve"><tspan fill="#d4d4d4">Searching for updates (1-5 minutes)...</tspan></text>
    <text x="22" y="392" xml:space="preserve"><tspan fill="#7a828e">  skipping feature upgrade: Feature update to Windows 11, version 25H2</tspan></text>
    <text x="22" y="412" xml:space="preserve"><tspan fill="#d4d4d4">  1   612.4 MB  2026-10 Cumulative Update for Windows 11 Version 24H2 for x64 (KB5066835)</tspan></text>
    <text x="22" y="432" xml:space="preserve"><tspan fill="#d4d4d4">  2   75.1 MB   2026-10 .NET Framework 3.5 and 4.8.1 Cumulative Update (KB5066131)</tspan></text>
    <text x="22" y="452" xml:space="preserve"><tspan fill="#d4d4d4">  3   12.9 MB   Security Intelligence Update for Microsoft Defender Antivirus (KB2267602)</tspan></text>
    <text x="22" y="472" xml:space="preserve"><tspan fill="#d4d4d4">  Install which? (Enter = all, e.g. 1,3 / n = skip): </tspan><tspan fill="#ffd866">&lt;Enter&gt;</tspan></text>
    <text x="22" y="492" xml:space="preserve"><tspan fill="#4ec96b">  OK      2026-10 Cumulative Update for Windows 11 Version 24H2 for x64 (KB5066835)</tspan></text>
    <text x="22" y="512" xml:space="preserve"><tspan fill="#4ec96b">  OK      2026-10 .NET Framework 3.5 and 4.8.1 Cumulative Update (KB5066131)</tspan></text>
    <text x="22" y="532" xml:space="preserve"><tspan fill="#4ec96b">  OK      Security Intelligence Update for Microsoft Defender Antivirus (KB2267602)</tspan></text>
    <text x="22" y="552" xml:space="preserve"></text>
    <text x="22" y="572" xml:space="preserve"><tspan fill="#d4d4d4">Next: turn off automatic feature upgrades and driver updates, keep monthly security updates automatic.</tspan></text>
    <text x="22" y="592" xml:space="preserve"><tspan fill="#7a828e">   ExcludeWUDriversInQualityUpdate  = 1            no driver updates through Windows Update</tspan></text>
    <text x="22" y="612" xml:space="preserve"><tspan fill="#7a828e">   TargetReleaseVersionInfo         = 24H2         pinned version - no feature upgrades</tspan></text>
    <text x="22" y="632" xml:space="preserve"><tspan fill="#7a828e">   AUOptions                        = 4            download and install security updates automatically</tspan></text>
    <text x="22" y="652" xml:space="preserve"><tspan fill="#7a828e">   NoAutoRebootWithLoggedOnUsers    = 1            never force a restart while someone is signed in</tspan></text>
    <text x="22" y="672" xml:space="preserve"><tspan fill="#d4d4d4">Apply these Windows Update settings? [Y/n]: </tspan><tspan fill="#ffd866">y</tspan></text>
    <text x="22" y="692" xml:space="preserve"><tspan fill="#4ec96b">Update policy applied. Menu option 6 undoes it.</tspan></text>
    <text x="22" y="712" xml:space="preserve"><tspan fill="#e5c07b">A restart is needed to finish installing updates.</tspan></text>
  </g>
</svg>
