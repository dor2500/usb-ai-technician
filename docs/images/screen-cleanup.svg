  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="525" y="22" fill="#9da5b4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Administrator: USB AI Technician</text>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14">
    <text x="22" y="52" xml:space="preserve"><tspan fill="#4fc1ff">=== 1. Clean up this PC ===</tspan></text>
    <text x="22" y="72" xml:space="preserve"><tspan fill="#d4d4d4">Scanning installed programs...</tspan></text>
    <text x="22" y="92" xml:space="preserve"><tspan fill="#d4d4d4">Found 9 programs/apps (drivers, runtimes and system parts are hidden and always kept).</tspan></text>
    <text x="22" y="112" xml:space="preserve"><tspan fill="#d4d4d4">Starting the AI technician (gpt-oss-20b-MXFP4.gguf)...</tspan></text>
    <text x="22" y="132" xml:space="preserve"><tspan fill="#d4d4d4">  Loading the model from the USB drive (a USB 3 stick takes 1-3 minutes)............</tspan></text>
    <text x="22" y="152" xml:space="preserve"><tspan fill="#4ec96b">  AI technician ready (41s).</tspan></text>
    <text x="22" y="172" xml:space="preserve"><tspan fill="#d4d4d4">  AI is reviewing programs 1-9 of 9...</tspan></text>
    <text x="22" y="192" xml:space="preserve"></text>
    <text x="22" y="212" xml:space="preserve"><tspan fill="#7a828e">  No.  Action   AI      Name                                     Publisher              AI reason</tspan></text>
    <text x="22" y="232" xml:space="preserve"><tspan fill="#4ec96b">  1    keep     keep    7-Zip 24.08 (x64 edition)                Igor Pavlov            file archiver</tspan></text>
    <text x="22" y="252" xml:space="preserve"><tspan fill="#4ec96b">  2    keep     keep    Google Chrome                            Google LLC             web browser</tspan></text>
    <text x="22" y="272" xml:space="preserve"><tspan fill="#f47174">  3    REMOVE   remove  HP Wolf Security - Console               HP Inc.                OEM security trial</tspan></text>
    <text x="22" y="292" xml:space="preserve"><tspan fill="#f47174">  4    REMOVE   remove  McAfee LiveSafe                          McAfee, LLC            expired bundled trial antivirus</tspan></text>
    <text x="22" y="312" xml:space="preserve"><tspan fill="#e5c07b">  5    keep     ask     Microsoft 365 - en-us                    Microsoft Corporation  depends on your subscription</tspan></text>
    <text x="22" y="332" xml:space="preserve"><tspan fill="#e5c07b">  6    keep     ask     Spotify                                  Spotify AB             personal music app</tspan></text>
    <text x="22" y="352" xml:space="preserve"><tspan fill="#f47174">  7    REMOVE   remove  WildTangent Games                        WildTangent            preinstalled games</tspan></text>
    <text x="22" y="372" xml:space="preserve"><tspan fill="#4ec96b">  8    keep     keep    Zoom Workplace                           Zoom Video Communica~  video meetings</tspan></text>
    <text x="22" y="392" xml:space="preserve"><tspan fill="#f47174">  9    REMOVE   remove  Microsoft.BingNews                       Microsoft Corporation  preinstalled news app</tspan></text>
    <text x="22" y="412" xml:space="preserve"></text>
    <text x="22" y="432" xml:space="preserve"><tspan fill="#4fc1ff">  4 marked for removal. Everything else is kept.</tspan></text>
    <text x="22" y="452" xml:space="preserve"><tspan fill="#d4d4d4">  k 3,5-7  keep these        r 9,12  remove these        ai  reset to AI suggestions</tspan></text>
    <text x="22" y="472" xml:space="preserve"><tspan fill="#d4d4d4">  keepall  keep everything   go      continue            q   cancel</tspan></text>
    <text x="22" y="492" xml:space="preserve"><tspan fill="#d4d4d4">  choice: </tspan><tspan fill="#ffd866">go</tspan></text>
    <text x="22" y="512" xml:space="preserve"></text>
    <text x="22" y="532" xml:space="preserve"><tspan fill="#e5c07b">These will be uninstalled:</tspan></text>
    <text x="22" y="552" xml:space="preserve"><tspan fill="#d4d4d4">   - HP Wolf Security - Console  (Program)</tspan></text>
    <text x="22" y="572" xml:space="preserve"><tspan fill="#d4d4d4">   - McAfee LiveSafe  (Program)</tspan></text>
    <text x="22" y="592" xml:space="preserve"><tspan fill="#d4d4d4">   - WildTangent Games  (Program)</tspan></text>
    <text x="22" y="612" xml:space="preserve"><tspan fill="#d4d4d4">   - Microsoft.BingNews  (Store app)</tspan></text>
    <text x="22" y="632" xml:space="preserve"><tspan fill="#d4d4d4">Uninstall 4 item(s)? Type YES to continue: </tspan><tspan fill="#ffd866">YES</tspan></text>
    <text x="22" y="652" xml:space="preserve"><tspan fill="#d4d4d4">Creating a System Restore point first...</tspan></text>
    <text x="22" y="672" xml:space="preserve"><tspan fill="#4ec96b">  Restore point created.</tspan></text>
    <text x="22" y="692" xml:space="preserve"><tspan fill="#d4d4d4">Removing HP Wolf Security - Console...</tspan></text>
    <text x="22" y="712" xml:space="preserve"><tspan fill="#4ec96b">  removed</tspan></text>
