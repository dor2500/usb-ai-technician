<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a93c9"/>
    </marker>
    <style>
      .t { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
      .m { font-family: Cascadia Mono, Consolas, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#0f1430"/>

  <!-- USB -->
  <rect x="40" y="70" width="350" height="400" rx="18" fill="#18204a" stroke="#3a4ad9" stroke-width="2"/>
  <text x="64" y="108" class="t" font-size="24" font-weight="700" fill="#ffffff">USB stick</text>
  <text x="64" y="134" class="t" font-size="15" fill="#8a93c9">exFAT / NTFS · 32 GB or more</text>
  <g class="m" font-size="16" fill="#d4d8f0">
    <text x="64" y="180">Start.cmd</text><text x="230" y="180" fill="#8a93c9">double-click</text>
    <text x="64" y="215">src\</text><text x="230" y="215" fill="#8a93c9">PowerShell 5.1</text>
    <text x="64" y="250">bin\llama-server</text><text x="230" y="250" fill="#8a93c9"></text>
    <text x="64" y="285" fill="#59f0c2">models\gpt-oss-20b</text><text x="270" y="285" fill="#8a93c9">12 GB</text>
    <text x="64" y="320">Installers\</text><text x="230" y="320" fill="#8a93c9">your setups</text>
    <text x="64" y="355">config\</text><text x="230" y="355" fill="#8a93c9">settings</text>
    <text x="64" y="390">logs\  backups\</text><text x="230" y="390" fill="#8a93c9">stay here</text>
  </g>
  <text x="64" y="440" class="t" font-size="15" fill="#8a93c9">Nothing is installed on the PC.</text>

  <!-- Arrow -->
  <line x1="398" y1="270" x2="470" y2="270" stroke="#8a93c9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="434" y="255" class="t" font-size="14" fill="#8a93c9" text-anchor="middle">plug in</text>

  <!-- PC -->
  <rect x="480" y="40" width="680" height="480" rx="18" fill="#141a3c" stroke="#59f0c2" stroke-width="2" stroke-opacity="0.6"/>
  <text x="504" y="84" class="t" font-size="24" font-weight="700" fill="#ffffff">Windows PC</text>
  <text x="504" y="110" class="t" font-size="15" fill="#8a93c9">Windows 10 / 11</text>

  <!-- AI bubble -->
  <rect x="756" y="56" width="384" height="76" rx="14" fill="#0e2a2a" stroke="#59f0c2"/>
  <text x="776" y="86" class="t" font-size="17" font-weight="700" fill="#59f0c2">Local AI technician (gpt-oss-20b)</text>
  <text x="776" y="112" class="t" font-size="14" fill="#a6f7df">llama-server on 127.0.0.1 · suggests, never acts</text>

  <!-- Step cards -->
  <g class="t">
    <rect x="504" y="160" width="632" height="100" rx="14" fill="#2a1830" stroke="#ff7a7a"/>
    <text x="528" y="196" font-size="20" font-weight="700" fill="#ffb0b0">1  Clean up</text>
    <text x="528" y="224" font-size="15" fill="#e8d5da">Lists programs and Store apps · AI marks the bloatware</text>
    <text x="528" y="246" font-size="15" fill="#e8d5da">You choose what to keep · restore point · uninstall · old temp files</text>

    <rect x="504" y="276" width="632" height="100" rx="14" fill="#2c2614" stroke="#ffd866"/>
    <text x="528" y="312" font-size="20" font-weight="700" fill="#ffe7a3">2  Install</text>
    <text x="528" y="340" font-size="15" fill="#efe6c9">Pick setups from the Installers folder on the USB</text>
    <text x="528" y="362" font-size="15" fill="#efe6c9">Detects MSI / MSIX / Inno / NSIS / WiX and installs silently</text>

    <rect x="504" y="392" width="632" height="112" rx="14" fill="#122a24" stroke="#59f0c2"/>
    <text x="528" y="428" font-size="20" font-weight="700" fill="#a6f7df">3  Update</text>
    <text x="528" y="456" font-size="15" fill="#d3efe6">Installs every pending Windows update (built-in Windows Update API)</text>
    <text x="528" y="478" font-size="15" fill="#d3efe6">Then: no feature upgrades, no driver updates, security updates stay</text>
    <text x="528" y="498" font-size="15" fill="#d3efe6">automatic · fully undoable from menu option 6</text>
  </g>
  <line x1="950" y1="132" x2="950" y2="160" stroke="#59f0c2" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
